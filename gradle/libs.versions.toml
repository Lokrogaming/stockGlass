[versions]
agp = "8.4.0"
kotlin = "1.9.24"
compose_bom = "2024.06.00"
compose_compiler = "1.5.11"
junit = "4.13.2"

[plugins]
android-application = { id = "com.android.tools.build:gradle", version = "8.4.0" }
kotlin-android = { id = "org.jetbrains.kotlin:gradle-plugin", version = "1.9.24" }

[libraries]
androidxComposeBom = { module = "androidx.compose:compose-bom", version.ref = "compose_bom" }
androidxComposeMaterial3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidxComposeFoundation = { module = "androidx.compose.foundation:foundation", version = "1.6.1" }
androidxComposeFoundationLayout = { module = "androidx.compose.foundation:foundation-layout", version = "1.6.1" }
androidxComposeUi = { module = "androidx.compose.ui:ui", version = "1.6.1" }
androidxComposeUiTooling = { module = "androidx.compose.ui:ui-tooling", version = "1.6.1" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version = "1.9.0" }
junit = { module = "junit:junit", version = "4.13.2" }
androidxTestRunner = { module = "androidx.test:runner", version = "1.5.2" }
androidxTestRules = { module = "androidx.test:rules", version = "1.5.0" }
androidxTestExtJunit = { module = "androidx.test.ext:junit", version = "1.1.5" }
androidxComposeUiTest = { module = "androidx.compose.ui:ui-test", version = "1.6.1" }
androidxComposeUiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version = "1.6.1" }

[bundles]
