[versions]
agp = "8.4.0"
kotlin = "1.9.24"
compose_bom = "2024.06.00"
compose_compiler = "1.5.11"
junit = "4.13.2"

[plugins]
android-application = { id = "com.android.tools.build:gradle", version = "8.4.0" }
kotlin-android = { id = "org.jetbrains.kotlin:gradle-plugin", version = "1.9.24" }

[libraries]
androidxComposeBom = { module = "androidx.compose:compose-bom", version.ref = "compose_bom" }
androidxComposeMaterial3 = { group = "androidx.compose.material3", name = "material3", version = "1.2.0" }
androidxComposeFoundation = { group = "androidx.compose.foundation", name = "foundation", version = "1.6.1" }
androidxComposeFoundationLayout = { group = "androidx.compose.foundation", name = "foundation-layout", version = "1.6.1" }
androidxComposeUi = { group = "androidx.compose.ui", name = "ui", version = "1.6.1" }
androidxComposeUiTooling = { group = "androidx.compose.ui", name = "ui-tooling", version = "1.6.1" }
androidxActivityCompose = { group = "androidx.activity", name = "activity-compose", version = "1.9.0" }
junit = { group = "junit", name = "junit", version = "4.13.2" }

[bundles]
