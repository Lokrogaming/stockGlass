name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Android SDK Command Line Tools
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          rm -rf $ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          cd $ANDROID_HOME/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip
          if [ -d cmdline-tools ]; then
            mv cmdline-tools/* . 2>/dev/null || true
            rmdir cmdline-tools 2>/dev/null || true
          fi
          rm -f /tmp/cmdline-tools.zip
          echo "=== cmdline-tools latest contents ==="
          ls -la $ANDROID_HOME/cmdline-tools/latest/
          echo "=== bin contents ==="
          ls -la $ANDROID_HOME/cmdline-tools/latest/bin/ 2>/dev/null || echo "NO BIN DIR"

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "d56f5187479451eabf01fb78af6df4131e633742" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          echo "=== sdkmanager version ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version || echo "sdkmanager --version failed"
          echo "=== Installing SDK components ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Align Android SDK env vars
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: gradle clean testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumented-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Android SDK Command Line Tools
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          rm -rf $ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          cd $ANDROID_HOME/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip
          if [ -d cmdline-tools ]; then
            mv cmdline-tools/* . 2>/dev/null || true
            rmdir cmdline-tools 2>/dev/null || true
          fi
          rm -f /tmp/cmdline-tools.zip

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "d56f5187479451eabf01fb78af6df4131e633742" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install system image for emulator
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "system-images;android-35;google_apis;x86_64"

      - name: Create AVD
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n stockglass_avd \
            -k "system-images;android-35;google_apis;x86_64" \
            -g google_apis \
            -d pixel_6

      - name: Start emulator
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          $ANDROID_HOME/emulator/emulator -avd stockglass_avd -no-snapshot -no-window -gpu swiftshader_indirect -wipe-data &
          echo "Waiting for emulator to boot..."
          $ANDROID_HOME/platform-tools/adb wait-for-device
          $ANDROID_HOME/platform-tools/adb shell wait-for-property init.svc.bootanim completed
          echo "Emulator booted."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Instrumentation Tests
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: gradle connectedDebugAndroidTest

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: warn
